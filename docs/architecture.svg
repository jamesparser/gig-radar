<text x="796" y="178" font-size="12" font-weight="500" fill="#f2cc60" text-anchor="middle">③ prefill only</text>
<rect x="30" y="290" width="1140" height="200" rx="16" fill="#0f161b" stroke="#1f2a31" stroke-width="1.5"/>
<text x="52" y="320" font-size="13" font-weight="600" fill="#6b7782" letter-spacing="0.6">apps/web — one Next.js deployment (Vercel)</text>
<rect x="60" y="340" width="300" height="120" rx="12" fill="#131c22" stroke="#2b3942" stroke-width="1.6"/>
<text x="210.0" y="370" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="middle">Next.js App Router</text>
<text x="210.0" y="394" font-size="13" fill="#9aa7b2" text-anchor="middle">landing · auth · dashboard</text>
<text x="210.0" y="414" font-size="13" fill="#9aa7b2" text-anchor="middle">Better Auth sessions (HTTP-only)</text>
<rect x="450" y="340" width="300" height="120" rx="12" fill="#0c2422" stroke="#2dd4bf" stroke-width="1.6"/>
