<text x="210.0" y="144" font-size="13" fill="#9aa7b2" text-anchor="middle">plan, license key, export/delete</text>
<rect x="450" y="70" width="300" height="120" rx="12" fill="#0c2422" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="600.0" y="100" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="middle">Chrome extension (MV3)</text>
<text x="600.0" y="124" font-size="13" fill="#9aa7b2" text-anchor="middle">parsers · content script</text>
<text x="600.0" y="144" font-size="13" fill="#9aa7b2" text-anchor="middle">popup · background worker</text>
<text x="600.0" y="164" font-size="13" fill="#9aa7b2" text-anchor="middle">license key never reaches the page</text>
<rect x="840" y="70" width="300" height="120" rx="12" fill="#131c22" stroke="#2b3942" stroke-width="1.6"/>
<text x="990.0" y="100" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="middle">Job board page</text>
<text x="990.0" y="124" font-size="13" fill="#9aa7b2" text-anchor="middle">Upwork · Fiverr · Freelancer</text>
<text x="990.0" y="144" font-size="13" fill="#9aa7b2" text-anchor="middle">or the built-in fixture board</text>
<text x="990.0" y="164" font-size="13" fill="#9aa7b2" text-anchor="middle">(the supported demo path)</text>
