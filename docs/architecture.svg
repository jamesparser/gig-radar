<text x="160.0" y="640" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="middle">Postgres</text>
<text x="160.0" y="664" font-size="13" fill="#9aa7b2" text-anchor="middle">Neon / Supabase</text>
<text x="160.0" y="684" font-size="13" fill="#9aa7b2" text-anchor="middle">users · profiles · jobs</text>
<text x="160.0" y="704" font-size="13" fill="#9aa7b2" text-anchor="middle">matches · drafts · licenses</text>
<text x="160.0" y="724" font-size="13" fill="#9aa7b2" text-anchor="middle">usage · audit</text>
<rect x="280" y="610" width="200" height="140" rx="12" fill="#131c22" stroke="#2b3942" stroke-width="1.6"/>
<text x="380.0" y="640" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="middle">LLM provider</text>
<text x="380.0" y="664" font-size="13" fill="#9aa7b2" text-anchor="middle">Anthropic · OpenAI-style</text>
<text x="380.0" y="684" font-size="13" fill="#9aa7b2" text-anchor="middle">job text = untrusted data</text>
<text x="380.0" y="704" font-size="13" fill="#9aa7b2" text-anchor="middle">JSON-only · zod-validated</text>
<text x="380.0" y="724" font-size="13" fill="#9aa7b2" text-anchor="middle">template fallback if down</text>
<rect x="500" y="610" width="200" height="140" rx="12" fill="#131c22" stroke="#2b3942" stroke-width="1.6"/>
<text x="600.0" y="640" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="middle">Stripe (test mode)</text>
<text x="600.0" y="664" font-size="13" fill="#9aa7b2" text-anchor="middle">Checkout · Portal</text>
<text x="600.0" y="684" font-size="13" fill="#9aa7b2" text-anchor="middle">signed webhook →</text>
<text x="600.0" y="704" font-size="13" fill="#9aa7b2" text-anchor="middle">plan + license key</text>
