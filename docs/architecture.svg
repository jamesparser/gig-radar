<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">GigRadar architecture</title>
<desc id="d">A Chrome extension and a dashboard talk to one Hono API inside a Next.js deployment. The API uses a shared core package for scoring and prompts, Postgres for data, an LLM provider for drafts, Stripe for billing and licensing, and Resend for the digest. The extension only prefills a proposal; the freelancer submits it.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7782"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2cc60"/></marker>
</defs>
<rect width="1200" height="820" rx="20" fill="#0a0f12"/>
