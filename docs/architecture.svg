<text x="612" y="268" font-size="12" font-weight="500" fill="#2dd4bf" text-anchor="start">② listings + license key</text>
<rect x="30" y="560" width="1140" height="220" rx="16" fill="#0f161b" stroke="#1f2a31" stroke-width="1.5"/>
<text x="52" y="590" font-size="13" font-weight="600" fill="#6b7782" letter-spacing="0.6">Backing services</text>
