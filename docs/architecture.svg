<text x="600.0" y="414" font-size="13" fill="#9aa7b2" text-anchor="middle">ingest · match · draft · digest · billing</text>
<text x="600.0" y="434" font-size="13" fill="#9aa7b2" text-anchor="middle">(apps/api — also runs standalone)</text>
<rect x="840" y="340" width="300" height="120" rx="12" fill="#131c22" stroke="#2b3942" stroke-width="1.6"/>
<text x="990.0" y="370" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="middle">packages/core</text>
<text x="990.0" y="394" font-size="13" fill="#9aa7b2" text-anchor="middle">fit-v1 scorer · draft prompts</text>
<text x="990.0" y="414" font-size="13" fill="#9aa7b2" text-anchor="middle">digest renderer · locked plan table</text>
<text x="990.0" y="434" font-size="13" fill="#9aa7b2" text-anchor="middle">pure TypeScript, unit-tested</text>
